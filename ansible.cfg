[defaults]
inventory          = inventory/aws_ec2.yml
roles_path         = roles:extras/roles
remote_user        = rocky
# Written by: terraform -chdir=terraform output -raw private_key > roboshop.pem
private_key_file   = roboshop.pem
# Hosts are recreated (new host keys) on every Terraform rebuild.
# Turn this on if your hosts are long-lived.
host_key_checking  = False
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
# Faster, and lets tasks use become_user with an unprivileged user without ACLs.
pipelining = True
