---
# RoboShop: one play per tier so data stores are up before the apps that
# use them, and the frontend goes last.
#
#   ansible-playbook roboshop.yml                      # everything
#   ansible-playbook roboshop.yml --limit cart          # one component
#   ansible-pull -U <repo> -i localhost, roboshop.yml -e roboshop_component=cart

- name: Wait for hosts and group them by component
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Fail if the host has no known component
      ansible.builtin.assert:
        that: roboshop_component in roboshop_components
        fail_msg: >-
          {{ inventory_hostname }} is not in any RoboShop group
          ({{ roboshop_components | join(', ') }}). Put it in one, or pass
          -e roboshop_component=<name>.
        quiet: true

    - name: Wait until the host accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Add the host to its component group
      ansible.builtin.group_by:
        key: "{{ roboshop_component }}"
      changed_when: false

- name: Data tier
  hosts: mongodb:rabbitmq:redis:mysql
  become: true
  tasks:
    - name: Apply the component role
      ansible.builtin.include_role:
        name: "{{ roboshop_component }}"

- name: Application tier
  hosts: catalogue:user:cart:shipping:payment
  become: true
  tasks:
    - name: Apply the component role
      ansible.builtin.include_role:
        name: "{{ roboshop_component }}"

- name: Web tier
  hosts: frontend
  become: true
  tasks:
    - name: Apply the component role
      ansible.builtin.include_role:
        name: "{{ roboshop_component }}"
