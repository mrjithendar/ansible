- name: Setup RoboShop Project
  hosts: all
  # roles:
  #   - frontend
  vars:
    DOMAIN: roboshop.com
  # become: yes
  # Become is nothing but a sudo in CLI, Also this become can be used in task level also
  tasks:

    # - name: Installing NGiNX Server
    #   yum:
    #     name: nginx
    #     state: latest
    # - name: Starting nginx services
    #   systemd: 
    #     daemon_reload: yes
    #     enabled: yes
    #     state: restarted
    #     name: nginx
    #   ignore_errors: yes
    #   when: component == "frontend"
    #   tags:
    #     - frontend

    # - name: Load Frontend Role
    #   import_role:
    #     name: frontend
    #   when: component == "frontend"
    #   tags:
    #     - frontend

    - name: Load MongoDB Role
      import_role:
        name: mongodb
      when: component == "mongodb"
      tags:
        - mongodb
    
    - name: Load MySQL Role
      import_role:
        name: mysql
      when: component == "mysql"
      tags:
        - mysql

    - name: Load Cart Role
      import_role:
        name: cart
      when: component == "cart"
      tags:
        - cart

    - name: Load Catalogue Role
      import_role:
        name: catalogue
      when: component == "catalogue"
      tags:
        - catalogue

    - name: Load User Role
      import_role:
        name: user
      when: component == "user"
      tags:
        - user

    - name: Load Shipping Role
      import_role:
        name: shipping
      when: component == "shipping"
      tags:
        - shipping

    - name: Load Payment Role
      import_role:
        name: payment
      when: component == "payment"
      tags:
        - payment

    - name: Load Redis Role
      import_role:
       name: redis
      when: component == "redis"
      tags:
       - redis

    - name: Load RabbitMQ Role
      import_role:
       name: rabbitmq
      when: component == "rabbitmq"
      tags:
       - rabbitmq