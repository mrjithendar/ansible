---
- name: Install Node.js
  ansible.builtin.include_role:
    name: common
    tasks_from: nodejs

- name: Create the cart directory
  ansible.builtin.file:
    path: "{{ cart_app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy the cart application
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ cart_app_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  loop:
    - server.js
    - package.json
  notify: Restart cart

- name: Install cart npm dependencies
  community.general.npm:
    path: "{{ cart_app_dir }}"
    production: true
  become_user: "{{ app_user }}"
  notify: Restart cart

- name: Install the cart systemd unit
  ansible.builtin.template:
    src: cart.service.j2
    dest: /etc/systemd/system/cart.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cart

- name: Enable and start cart
  ansible.builtin.systemd_service:
    name: cart
    enabled: true
    state: started
    daemon_reload: true
