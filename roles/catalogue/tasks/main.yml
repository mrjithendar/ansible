---
- name: Install Node.js
  ansible.builtin.include_role:
    name: common
    tasks_from: nodejs

- name: Create the catalogue directory
  ansible.builtin.file:
    path: "{{ catalogue_app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy the catalogue application
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ catalogue_app_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  loop:
    - server.js
    - package.json
  notify: Restart catalogue

- name: Install catalogue npm dependencies
  community.general.npm:
    path: "{{ catalogue_app_dir }}"
    production: true
  become_user: "{{ app_user }}"
  notify: Restart catalogue

- name: Install the catalogue systemd unit
  ansible.builtin.template:
    src: catalogue.service.j2
    dest: /etc/systemd/system/catalogue.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart catalogue

- name: Enable and start catalogue
  ansible.builtin.systemd_service:
    name: catalogue
    enabled: true
    state: started
    daemon_reload: true
