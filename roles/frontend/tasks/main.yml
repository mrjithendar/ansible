- name: Include Common Role for OS {{COMPONENT}}
  include_role:
    name: common
    tasks_from: os

# - name: set host name and shutdown behaviour for {{COMPONENT}}
#   shell: |
#     set-hostname {{COMPONENT}}
#     disable-auto-shutdown
   
- name: Installing NGiNX Server
  yum:
    name: nginx
    state: latest

- name: Delete default NGiNX Content
  file:
    state: absent
    path: /usr/share/nginx/html

- name: Create NGiNX Deirecory
  file:
    state: directory
    path: /usr/share/nginx/html

- name: List files in roles/forntend/files/static
  find:
    path: /usr/share/easy-rsa
    recurse: yes
    file_type: any
  register: files_to_copy

- name: Deploying WebApplication (frontend server)
  copy:
    src: "{{ item }}" 
    dest: /usr/share/nginx/html/
    remote_src: no
  with_items:
   - "{{ files_to_copy.stdout_lines }}"

# - name: Move Artifiact Files /usr/share/nginx/html/
#   shell: |
#     cd /usr/share/nginx/html
#     mv static/* .
#     rm -rf static

#mv localhost.conf /etc/nginx/default.d/roboshop.conf

- name: Setup /etc/nginx/default.d/roboshop.conf
  template:
    src: roboshop.conf
    dest: /etc/nginx/default.d/roboshop.conf

- name: Update Nginx Configuration
  template:
   src: nginx.conf
   dest: /etc/nginx/nginx.conf

- name: Starting nginx services
  systemd: 
   daemon_reload: yes
   enabled: yes
   state: restarted
   name: nginx
  ignore_errors: yes