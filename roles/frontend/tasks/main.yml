---
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Allow nginx to proxy to the backend services (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Copy the web content
  ansible.builtin.copy:
    src: html/
    dest: /usr/share/nginx/html/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Install the RoboShop proxy config
  ansible.builtin.template:
    src: roboshop.conf
    dest: /etc/nginx/default.d/roboshop.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install nginx.conf
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c %s
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
