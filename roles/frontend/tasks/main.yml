- name: Include Common Role for OS {{COMPONENT}}
  include_role:
    name: common
    tasks_from: os

# - name: set host name and shutdown behaviour for {{COMPONENT}}
#   shell: |
#     set-hostname {{COMPONENT}}
#     disable-auto-shutdown
   
- name: Installing NGiNX Server
  yum:
    name: nginx
    state: latest

- name: Delete default NGiNX Content
  file:
    state: absent
    path: /usr/share/nginx/html

- name: Create NGiNX Deirecory
  file:
    state: directory
    path: /usr/share/nginx/html

- name: Deploying WebApplication (frontend server)
  shell: cp -r /root/ansible/roles/frontend/files/html/ /usr/share/nginx/html/

- name: Setup /etc/nginx/default.d/roboshop.conf
  template:
    src: roboshop.conf
    dest: /etc/nginx/default.d/roboshop.conf

- name: Update Nginx Configuration
  template:
   src: nginx.conf
   dest: /etc/nginx/nginx.conf

- name: Starting nginx services
  systemd: 
   daemon_reload: yes
   enabled: yes
   state: restarted
   name: nginx
  ignore_errors: yes