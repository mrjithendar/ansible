---
- name: Add the MongoDB repository for version {{ mongodb_version }}
  ansible.builtin.yum_repository:
    name: mongodb-org-{{ mongodb_version }}
    description: MongoDB {{ mongodb_version }} Repository
    baseurl: https://repo.mongodb.org/yum/redhat/9/mongodb-org/{{ mongodb_version }}/x86_64/
    gpgcheck: true
    gpgkey: https://pgp.mongodb.com/server-{{ mongodb_version }}.asc
    mode: "0644"

- name: Install MongoDB
  ansible.builtin.dnf:
    name: mongodb-org
    state: present

- name: Listen on all interfaces (the security group limits access to the VPC)
  ansible.builtin.lineinfile:
    path: /etc/mongod.conf
    regexp: '^(\s*)bindIp:'
    line: '  bindIp: 0.0.0.0'
  notify: Restart mongod

- name: Enable and start mongod
  ansible.builtin.systemd_service:
    name: mongod
    enabled: true
    state: started

- name: Apply config changes before seeding
  ansible.builtin.meta: flush_handlers

- name: Wait for MongoDB to accept connections
  ansible.builtin.wait_for:
    port: 27017
    timeout: 60

- name: List existing databases
  ansible.builtin.command: mongosh --quiet --eval 'db.getMongo().getDBNames().join(",")'
  register: mongodb_existing
  changed_when: false

- name: Create the seed directory
  ansible.builtin.file:
    path: "{{ mongodb_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy seed scripts
  ansible.builtin.copy:
    src: "{{ item }}.js"
    dest: "{{ mongodb_data_dir }}/{{ item }}.js"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ mongodb_seed_databases }}"

- name: Seed databases that do not exist yet
  ansible.builtin.command: mongosh --quiet --file {{ mongodb_data_dir }}/{{ item }}.js
  loop: "{{ mongodb_seed_databases }}"
  when: item not in mongodb_existing.stdout.split(',')
  changed_when: true
