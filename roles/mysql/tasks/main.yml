---
# Self-hosted alternative. The default Terraform setup uses Aurora MySQL and
# does not create a mysql instance, so this role normally only runs with
# roboshop_mysql_mode=self_hosted.

- name: Install MySQL server and the Python driver
  ansible.builtin.dnf:
    name:
      - mysql-server
      - python3-PyMySQL
    state: present

- name: Enable and start MySQL
  ansible.builtin.systemd_service:
    name: mysqld
    enabled: true
    state: started

- name: Set the root password
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ mysql_root_password }}"
    check_implicit_admin: true
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/lib/mysql/mysql.sock

- name: Load the shipping schema and create its DB user
  ansible.builtin.include_role:
    name: shipping
    tasks_from: schema
  vars:
    shipping_db_login_unix_socket: /var/lib/mysql/mysql.sock
    shipping_db_login_user: root
    shipping_db_login_password: "{{ mysql_root_password }}"
