---
- name: Install Python and build tools
  ansible.builtin.dnf:
    name:
      - python3
      - python3-devel
      - gcc
    state: present

- name: Create the payment directory
  ansible.builtin.file:
    path: "{{ payment_app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy the payment application
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ payment_app_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  loop:
    - payment.py
    - rabbitmq.py
    - payment.ini
    - requirements.txt
  notify: Restart payment

- name: Install Python dependencies into a virtualenv
  ansible.builtin.pip:
    requirements: "{{ payment_app_dir }}/requirements.txt"
    virtualenv: "{{ payment_venv }}"
    virtualenv_command: python3 -m venv
  become_user: "{{ app_user }}"
  notify: Restart payment

- name: Write the payment environment file
  ansible.builtin.template:
    src: payment.env.j2
    dest: /etc/roboshop/payment.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart payment

- name: Install the payment systemd unit
  ansible.builtin.template:
    src: payment.service.j2
    dest: /etc/systemd/system/payment.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart payment

- name: Enable and start payment
  ansible.builtin.systemd_service:
    name: payment
    enabled: true
    state: started
    daemon_reload: true
