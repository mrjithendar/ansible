- name: Include Common Role for OS {{COMPONENT}}
  include_role:
    name: common
    tasks_from: os
   
- name: Installing erlang repos
  shell: |
    curl -s {{Erlang}} | sudo bash
    yum clean all && yum -y makecache

- name: Installing Erlang Package
  yum: 
    name: erlang
    state: latest

- name: Adding RabbitMQ Repo
  shell: |
    curl -s {{RabbitMQ_Repository}} | sudo bash

- name: Installing RabbitMQ Server
  yum: 
    name: rabbitmq-server
    state: latest

- name: Start RabbitMQ service
  systemd:
    daemon_reload: yes
    name: rabbitmq-server
    state: started
    enabled: yes

- name: Adding RabbitMQ user for Application
  shell: |
    rabbitmqctl add_user roboshop roboshop123
    rabbitmqctl set_user_tags roboshop administrator
    rabbitmqctl set_permissions -p / roboshop ".*" ".*" ".*"

- name: reStart RabbitMQ service
  systemd:
    name: rabbitmq-server
    state: restarted
