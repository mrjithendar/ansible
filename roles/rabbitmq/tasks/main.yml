---
- name: Import the RabbitMQ signing keys
  ansible.builtin.rpm_key:
    key: "{{ item }}"
    state: present
  loop: "{{ rabbitmq_signing_keys }}"

- name: Add the RabbitMQ and Erlang repositories
  ansible.builtin.yum_repository:
    name: "{{ item.name }}"
    description: "{{ item.name }}"
    baseurl: "{{ item.baseurl }}"
    repo_gpgcheck: true
    gpgcheck: true
    gpgkey:
      - "{{ item.gpgkey }}"
      - "{{ rabbitmq_signing_keys[0] }}"
    sslverify: true
    mode: "0644"
  loop: "{{ rabbitmq_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install Erlang and RabbitMQ
  ansible.builtin.dnf:
    name:
      - socat
      - logrotate
      - erlang
      - rabbitmq-server
    state: present

- name: Enable and start RabbitMQ
  ansible.builtin.systemd_service:
    name: rabbitmq-server
    enabled: true
    state: started

- name: Create the application user
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_app_user }}"
    password: "{{ rabbitmq_app_password }}"
    update_password: always
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present
  no_log: true
