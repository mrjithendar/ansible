---
# Self-hosted alternative. The default Terraform setup uses ElastiCache and
# does not create a redis instance, so this role normally does not run.

- name: Install Redis
  ansible.builtin.dnf:
    name: redis
    state: present

- name: Listen on all interfaces (the security group limits access to the VPC)
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^bind '
    line: bind 0.0.0.0
  notify: Restart redis

- name: Enable and start Redis
  ansible.builtin.systemd_service:
    name: redis
    enabled: true
    state: started
