---
- name: Install Node.js
  ansible.builtin.include_role:
    name: common
    tasks_from: nodejs

- name: Create the user directory
  ansible.builtin.file:
    path: "{{ user_app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy the user application
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ user_app_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  loop:
    - server.js
    - package.json
  notify: Restart user

- name: Install user npm dependencies
  community.general.npm:
    path: "{{ user_app_dir }}"
    production: true
  become_user: "{{ app_user }}"
  notify: Restart user

- name: Install the user systemd unit
  ansible.builtin.template:
    src: user.service.j2
    dest: /etc/systemd/system/user.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart user

- name: Enable and start user
  ansible.builtin.systemd_service:
    name: user
    enabled: true
    state: started
    daemon_reload: true
