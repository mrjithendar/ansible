---
- hosts: all
  tasks:
    - name: Print message
      debug:
        msg: Hello Ansible World
    - name: Installing NGiNX Server
      yum:
        name: nginx
        state: latest
    - name: Starting nginx services
      systemd: 
      daemon_reload: yes
      enabled: yes
      state: restarted
      name: nginx
      ignore_errors: yes