- Name: Install NGiNx Web Server
  gather_facts: yes
  hosts: all
  vars:
    DOMAIN: roboshop.com
  tasks:
    - name: Installing NGiNX Server
      yum:
        name: nginx
        state: latest
    - name: Starting nginx services
      systemd: 
        daemon_reload: yes
        enabled: yes
        state: restarted
        name: nginx
      ignore_errors: yes